services:
  - type: web
    name: signalstack-reports
    runtime: python
    plan: starter
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    disk:
      name: signalstack-reports-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_SESSION_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_DATA_DIR
        value: /opt/render/project/src/data
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ALLOWED_ORIGINS
        sync: false
      - key: RUN_SCHEDULES_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
  - type: cron
    name: signalstack-run-due-schedules
    runtime: python
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python trigger_due_schedules.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_BASE_URL
        sync: false
      - key: RUN_SCHEDULES_TOKEN
        sync: false
